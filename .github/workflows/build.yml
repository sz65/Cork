name: Build Cork

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4        # 不再拉 submodules

      # 按 .mise.toml 自动安装 tuist 4.208.0
      - uses: jdx/mise-action@v2

      - name: Tuist install
        run: tuist install

      - name: Tuist generate
        run: tuist generate --cache-profile none

      - name: Archive
        run: |
          xcodebuild -workspace Cork.xcworkspace \
            -scheme "Self-Compiled" \
            -configuration Release \
            -archivePath "$PWD/Cork.xcarchive" \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -30

      - name: Package
        run: |
          cp -R "Cork.xcarchive/Products/Applications/Cork.app" .
          zip -qry Cork-${{ github.ref_name }}.zip Cork.app

      - uses: actions/upload-artifact@v4
        with:
          name: Cork-${{ github.ref_name }}
          path: Cork-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Cork-*.zip
