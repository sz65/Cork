name: Build Cork

on:
  workflow_dispatch:      # 手动触发按钮
  push:
    tags: ["v*"]          # 推 tag 也自动触发

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 子模块是 SSH 地址，兜底改走 HTTPS
      - name: Rewrite submodule URLs
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      # 按 .mise.toml 自动安装 tuist 4.208.0
      - uses: jdx/mise-action@v2

      - name: Tuist install
        run: tuist install

      - name: Tuist generate
        run: tuist generate --cache-profile none

      # 关键：用 Self-Compiled scheme（免许可证版本）+ 关闭签名
      - name: Archive
        run: |
          xcodebuild -workspace Cork.xcworkspace \
            -scheme "Self-Compiled" \
            -configuration Release \
            -archivePath "$PWD/Cork.xcarchive" \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -30

      - name: Package
        run: |
          cp -R "Cork.xcarchive/Products/Applications/Cork.app" .
          zip -qry Cork-${{ github.ref_name }}.zip Cork.app

      - uses: actions/upload-artifact@v4
        with:
          name: Cork-${{ github.ref_name }}
          path: Cork-*.zip

      # 只有推 tag 时才发 Release，手动触发只构建
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Cork-*.zip
